<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Roulette">
<title>Roulette — 6 engine độc lập chọn 6 street</title>
<style>
:root{
  --ni:#0C1811;         /* nỉ bàn */
  --panel:#132419;
  --panel-2:#1A2E20;
  --line:#20382A;
  --nga:#E9E6DB;
  --nga-mo:#8A9990;
  --do:#C4302B;         /* số đỏ */
  --den:#252525;        /* số đen */
  --zero:#0E7A42;
  --chon:#2BE07A;       /* street được chọn */
  --chon-tram:#0A3D22;
  --cung:#F2B441;       /* vùng hàng xóm 1 */
  --cung2:#B98CF5;      /* vùng hàng xóm 2 */
  --cung3:#4FC3E8;      /* vùng hàng xóm 3 */
  --cung4:#FF8FA3;      /* vùng hàng xóm 4 */
  --dung:#2BE07A;
  --sai:#3A4A40;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ni);color:var(--nga);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;
  padding:14px 14px 40px;max-width:820px;margin:0 auto}
h1{font-size:17px;font-weight:600;margin:0}
h2{font-size:13px;font-weight:600;color:var(--nga-mo);margin:0 0 8px}
section{margin-bottom:20px}
.muted{color:var(--nga-mo)}
.small{font-size:12px}
.tiny{font-size:11px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.dem b{font-size:22px}

/* ---------- bàn cược mô phỏng ---------- */
.ban-wrap{overflow-x:auto;padding-bottom:4px}
.ban{display:flex;gap:3px;min-width:520px}
.o-zero{width:38px;display:flex;align-items:center;justify-content:center;background:var(--zero);
  border-radius:6px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;user-select:none;
  touch-action:manipulation}
.cot-wrap{display:flex;gap:3px;flex:1}
.cot{flex:1;display:flex;flex-direction:column;gap:3px}
.so{height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  font-size:13px;font-weight:600;color:#fff;cursor:pointer;user-select:none;
  touch-action:manipulation;border:1.5px solid transparent}
.so.do{background:var(--do)}
.so.den{background:var(--den);border-color:#3A3A3A}
.so.sang{background:var(--chon);color:#06301A;border-color:#7CF5B4}
.so.cung{box-shadow:inset 0 0 0 2px var(--cung)}
.so.cung2{box-shadow:inset 0 0 0 2px var(--cung2)}
.so.tam{background:var(--cung);color:#3D2A00;border-color:#FFE0A0}
.so.tam2{background:var(--cung2);color:#25103F;border-color:#DCC2FF}
.so.cung3{box-shadow:inset 0 0 0 2px var(--cung3)}
.so.tam3{background:var(--cung3);color:#062B38;border-color:#B6E7F7}
.so.cung4{box-shadow:inset 0 0 0 2px var(--cung4)}
.so.tam4{background:var(--cung4);color:#3D0A16;border-color:#FFD0D9}
.nhan-cot{display:flex;gap:3px;min-width:520px;margin-bottom:4px}
.nhan-cot .sp{width:38px;flex:0 0 38px}
.nhan-cot .n{flex:1;text-align:center;font-size:10px;color:var(--nga-mo);
  letter-spacing:.3px;height:14px}
.nhan-cot .n.on{color:var(--chon);font-weight:700}

/* ---------- vòng bánh xe ---------- */
.wheel{display:flex;gap:2px;min-width:660px}
.wo{flex:1;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;
  font-size:11px;font-weight:600;background:var(--panel-2);color:var(--nga-mo);border:1px solid var(--line)}
.wo.in{background:#3A2E10;color:#F7D897;border-color:#6B520F}
.wo.mid{background:var(--cung);color:#3D2A00;border-color:#FFE0A0;font-weight:700}
.wo.in2{background:#2C2144;color:#DCC2FF;border-color:#54408A}
.wo.mid2{background:var(--cung2);color:#25103F;border-color:#DCC2FF;font-weight:700}
.wo.in3{background:#152F3A;color:#B6E7F7;border-color:#2F6D85}
.wo.mid3{background:var(--cung3);color:#062B38;border-color:#B6E7F7;font-weight:700}
.wo.in4{background:#3A1A22;color:#FFD0D9;border-color:#7A3543}
.wo.mid4{background:var(--cung4);color:#3D0A16;border-color:#FFD0D9;font-weight:700}

/* ---------- khối ---------- */
.hop{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.so-lieu{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.so-lieu .nhan{font-size:11px;color:var(--nga-mo)}
.so-lieu .gt{font-size:19px;font-weight:600;margin-top:2px}
.dien-giai{font-size:12px;color:var(--nga-mo);line-height:1.65;margin-top:10px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--nga-mo);text-align:left;padding:0 6px 7px;white-space:nowrap}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.ten-e{font-size:13px;font-weight:500}
.ghi{font-size:11px;color:var(--nga-mo);margin-top:1px}
.vien{display:inline-block;background:var(--chon-tram);color:var(--chon);border:1px solid var(--chon);
  border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.mach{font-size:16px;font-weight:700}
.mach.im{color:var(--nga-mo);font-weight:400}
.cham{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:3px}
.cham.d{background:var(--dung)}.cham.s{background:var(--sai)}

/* ---------- điều khiển ---------- */
.hang-nut{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nut{background:var(--panel-2);color:var(--nga);border:1px solid var(--line);border-radius:7px;
  padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
.nut:hover{border-color:var(--nga-mo)}
.cai-dat{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--nga-mo)}
.cai-dat label{display:flex;align-items:center;gap:7px}
input,textarea{background:var(--panel-2);color:var(--nga);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;font:inherit;font-size:13px}
input[type=number]{width:88px}
textarea{width:100%;height:56px;resize:vertical;line-height:1.7}
.trong{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  text-align:center;color:var(--nga-mo);font-size:13px;line-height:1.7}
.chu-thich{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--nga-mo);margin-top:8px}
.chu-thich i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;
  vertical-align:-1px;font-style:normal}

/* ---------- chọn phương án ---------- */
.che-do{display:flex;gap:8px;margin-bottom:18px}
.che{flex:1;padding:13px 10px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);color:var(--nga-mo);font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;touch-action:manipulation}
.che.on{background:var(--chon-tram);border-color:var(--chon);color:var(--chon)}
.che small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:2px}

/* ---------- bàn cược + bánh xe nằm cạnh nhau ---------- */
.doi-cot{display:flex;gap:14px;flex-wrap:wrap}
.doi-cot > div{flex:1 1 340px;min-width:0}
.nhan-nho{font-size:11px;color:var(--nga-mo);margin-bottom:5px}

/* ---------- chuỗi kết quả dưới ô nhập ---------- */
.chuoi{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.vien-so{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;color:#fff}
.vien-so.do{background:var(--do)}
.vien-so.den{background:var(--den);border:1px solid #3A3A3A}
.vien-so.zero{background:var(--zero)}
.vien-so.cuoi{outline:2px solid var(--nga);outline-offset:1px}
.nut-gap{background:none;border:0;color:var(--nga-mo);font:inherit;font-size:12px;
  cursor:pointer;padding:4px 0;text-decoration:underline}
.nut-gap:hover{color:var(--nga)}
</style>
</head>
<body>

<div class="top">
  <h1>Roulette — bánh xe châu Âu</h1>
  <div class="dem"><b id="soVong">0</b><span class="muted"> vòng</span></div>
</div>

<div class="che-do">
  <button class="che" id="btnNb" onclick="doiCheDo('nb')">Neighbour<small>vùng liền kề trên bánh xe</small></button>
  <button class="che" id="btnSt" onclick="doiCheDo('st')">6 Street<small>18 số trên bàn cược</small></button>
</div>

<div id="khoiNb"></div>
<div id="khoiSt"></div>

<section>
  <h2>Nhập kết quả vòng quay</h2>
  <div class="ban-wrap"><div class="ban" id="banNhap"></div></div>
  <div id="chuoiKq"></div>
  <div class="hang-nut">
    <button class="nut" onclick="xoa1()">Xoá vòng cuối</button>
    <button class="nut" onclick="phienMoi()">Phiên mới</button>
    <button class="nut" onclick="hienSua()" id="nutSua">Sửa cả chuỗi</button>
  </div>
  <div id="khoiSua" style="display:none;margin-top:10px">
    <textarea id="oChuoi" spellcheck="false" placeholder="Các số cách nhau bởi dấu cách, cũ → mới"></textarea>
    <div class="hang-nut"><button class="nut" onclick="dungChuoi()">Áp dụng chuỗi này</button></div>
  </div>
</section>

<section>
  <h2>Cài đặt</h2>
  <div class="cai-dat">
    <label>Bắt đầu chọn từ vòng
      <input type="number" id="oBatDau" value="60" min="20" max="400" onchange="ve()"></label>
    <label>Số vùng hàng xóm
      <input type="number" id="oSoVung" value="2" min="1" max="4" onchange="ve()"></label>
    <label>Số ô mỗi vùng
      <input type="number" id="oCoVung" value="9" min="3" max="18" onchange="ve()"></label>
    <label>Tiền cược mỗi số
      <input type="number" id="oCuoc" value="50000" step="10000" onchange="ve()"></label>
  </div>
  <p class="small muted" style="margin:10px 0 0">
    Cả hai phương án đều lời lỗ ±100% tiền đặt mỗi vòng. Trên bánh xe cân, mọi cỡ phủ
    đều cho đúng âm 2,70%. Chuỗi được lưu trong trình duyệt.
  </p>
</section>

<section>
  <h2>Bánh xe này có lệch không</h2>
  <div id="khoiChi2"></div>
  <div class="hang-nut">
    <button class="nut" onclick="doNguongNhieu()" id="nutNhieu">Đo ngưỡng nhiễu</button>
  </div>
  <div id="ketQuaNhieu"></div>
</section>

<script>
"use strict";
/* =====================================================================================
   PHẦN 1 — HÌNH HỌC BÁNH XE VÀ BÀN CƯỢC
   ===================================================================================== */
const WHEEL = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,
               14,31,9,22,18,29,7,28,12,35,3,26];
const NS = WHEEL.length;                       // 37
const POS = {}; WHEEL.forEach((n,i) => POS[n] = i);
const DO = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const STREETS = [];
for (let k = 0; k < 12; k++) STREETS.push([3*k+1, 3*k+2, 3*k+3]);
const ST_OF = {};
STREETS.forEach((s,k) => s.forEach(n => ST_OF[n] = k));
const P_ST = 3/37;                             // xác suất 1 street
const SO_CUNG = 18;                            // vùng hàng xóm 18 số

const modv = (i,m) => ((i % m) + m) % m;

/* =====================================================================================
   PHẦN 2 — TRẠNG THÁI TÍCH LUỸ
   Cập nhật từng vòng thay vì quét lại toàn bộ lịch sử, để phát lại 5000 vòng vẫn nhanh.
   ===================================================================================== */
const HL = 40;                                 // nửa đời của engine Recency
const PHAN_RA = Math.pow(0.5, 1/HL);

function ttMoi(){
  return {n:0, dem:new Array(37).fill(0), st:new Array(12).fill(0),
          rw:new Array(12).fill(0), rt:0,
          mk:Array.from({length:12}, () => new Array(12).fill(0)), cuoi:-1};
}
function ttCapNhat(tt, so){
  tt.n++;
  tt.dem[POS[so]]++;
  for (let k = 0; k < 12; k++) tt.rw[k] *= PHAN_RA;
  tt.rt *= PHAN_RA;
  tt.rt += 1;
  const k = (so in ST_OF) ? ST_OF[so] : -1;
  if (k >= 0){
    tt.st[k]++;
    tt.rw[k] += 1;
    if (tt.cuoi >= 0) tt.mk[tt.cuoi][k]++;
    tt.cuoi = k;
  }
}
function ttSaoChep(tt){
  return {n:tt.n, dem:tt.dem.slice(), st:tt.st.slice(), rw:tt.rw.slice(), rt:tt.rt,
          mk:tt.mk.map(r => r.slice()), cuoi:tt.cuoi};
}

/* =====================================================================================
   PHẦN 3 — SÁU ENGINE ĐỘC LẬP
   Mỗi engine chấm điểm cả 12 street. Điểm dương nghĩa là street đó đang trội hơn kỳ vọng.
   Không engine nào dùng chung công cụ với engine nào.
   ===================================================================================== */

/* 1. Chi bình phương trên 37 ô — công cụ chuẩn để dò bánh xe lệch vật lý.
      Điểm street = tổng phần dư chuẩn hoá (obs-exp)/√exp của 3 số trong street.      */
function eChi2(tt){
  if (tt.n < 40) return new Array(12).fill(0);
  const exp = tt.n / NS, se = Math.sqrt(exp);
  const res = new Array(37);
  for (let i = 0; i < NS; i++) res[POS[WHEEL[i]]] = (tt.dem[i] - exp) / se;
  return STREETS.map(s => s.reduce((a,m) => a + res[POS[m]], 0));
}

/* 2. Nhiệt vùng bánh xe — lệch vật lý xuất hiện thành cung liền kề chứ không phải ô lẻ.
      Làm mượt tần suất theo vòng tròn với cửa sổ ±3 ô rồi chiếu xuống street.          */
function eSector(tt, bk){
  bk = bk || 3;
  if (tt.n < 40) return new Array(12).fill(0);
  const tb = tt.n / NS, muot = new Array(NS);
  for (let i = 0; i < NS; i++){
    let s = 0;
    for (let d = -bk; d <= bk; d++) s += tt.dem[modv(i+d, NS)];
    muot[i] = s / (2*bk + 1);
  }
  return STREETS.map(s => s.reduce((a,m) => a + (muot[POS[m]] - tb) / Math.max(tb,1e-9), 0));
}

/* 3. Tần suất 12 street, kéo về đồng đều bằng prior Dirichlet.
      Mẫu càng nhỏ càng bị kéo mạnh, nên nó im lặng khi chưa có đủ dữ liệu.            */
function eFreq(tt, alpha){
  alpha = alpha || 36;
  const out = [];
  for (let k = 0; k < 12; k++){
    const p = (tt.st[k] + alpha*P_ST) / (tt.n + alpha);
    out.push((p - P_ST) / P_ST);
  }
  return out;
}

/* 4. Nhiệt gần đây — trọng số giảm mũ, nửa đời 40 vòng.
      Đây là thứ người chơi làm bằng mắt khi nhìn bảng điện tử, được hình thức hoá.     */
function eRecency(tt){
  if (tt.n < 20 || tt.rt <= 0) return new Array(12).fill(0);
  return tt.rw.map(w => (w/tt.rt - P_ST) / P_ST);
}

/* 5. Cặp hàng xóm — dò lệch hẹp, kiểu một khe ngăn bị lỏng làm 2 ô kề nhau cùng nóng.
      Chấm điểm từng cặp ô liền kề trên bánh xe, rồi cộng vào 2 ô thành viên.
      Khác engine 2 ở độ phân giải: ±1 thay vì ±3.                                     */
function eNeighbourPairs(tt){
  if (tt.n < 40) return new Array(12).fill(0);
  const expC = 2 * tt.n / NS, seC = Math.sqrt(expC);
  const diemO = new Array(NS).fill(0);
  for (let i = 0; i < NS; i++){
    const j = modv(i+1, NS);
    const z = (tt.dem[i] + tt.dem[j] - expC) / seC;
    diemO[i] += z; diemO[j] += z;
  }
  return STREETS.map(s => s.reduce((a,m) => a + diemO[POS[m]], 0));
}

/* 6. Markov bậc 1 trên chuỗi 12 street — street vừa ra làm khoá.                      */
function eMarkov(tt, alpha){
  alpha = alpha || 24;
  if (tt.cuoi < 0) return new Array(12).fill(0);
  const hang = tt.mk[tt.cuoi];
  let n = 0; for (const v of hang) n += v;
  if (n < 8) return new Array(12).fill(0);
  return hang.map(v => ((v + alpha/12) / (n + alpha) - 1/12) * 12);
}

const ENGINES = [
  {ten:"Chi2Bias",       ma:"CHI", f:eChi2,           mo:"chi bình phương 37 ô"},
  {ten:"SectorHeat",     ma:"SEC", f:eSector,         mo:"nhiệt cung bánh xe ±3 ô"},
  {ten:"StreetFreq",     ma:"FRQ", f:eFreq,           mo:"tần suất street có shrink"},
  {ten:"Recency",        ma:"REC", f:eRecency,        mo:"nhiệt gần đây, nửa đời 40"},
  {ten:"NeighbourPairs", ma:"NBR", f:eNeighbourPairs, mo:"cặp ô kề nhau cùng nóng"},
  {ten:"Markov",         ma:"MKV", f:eMarkov,         mo:"chuyển tiếp street bậc 1"}
];
const TEN_E = ENGINES.map(e => e.ten);

/* Bốc tuần tự: engine 1 lấy street điểm cao nhất, engine 2 lấy cao nhất trong phần còn
   lại, cứ thế. Ra đúng 6 street riêng biệt, mỗi engine sở hữu một street.             */
function chonSau(tt){
  const lay = new Set(), ra = [];
  for (const e of ENGINES){
    const d = e.f(tt);
    let tot = -1, diem = -Infinity;
    for (let k = 0; k < 12; k++){
      if (!lay.has(k) && d[k] > diem){ diem = d[k]; tot = k; }
    }
    if (tot < 0) for (let k = 0; k < 12; k++) if (!lay.has(k)){ tot = k; diem = 0; break; }
    lay.add(tot);
    ra.push({ten:e.ten, ma:e.ma, street:tot, diem:diem});
  }
  return ra;
}

/* Các vùng hàng xóm: bốc tuần tự các cung rời nhau, mỗi cung coVung ô liền kề trên
   bánh xe, chọn theo tổng tần suất cao nhất. Cung sau không được đè lên cung trước.
   Số nằm giữa mỗi cung được tô sáng riêng.                                            */
function cacVung(tt, coVung, soVung){
  if (tt.n < 40) return null;
  const daLay = new Set(), vung = [];
  for (let v = 0; v < soVung; v++){
    let tot = -1, best = -Infinity;
    for (let c = 0; c < NS; c++){
      let ok = true, s = 0;
      for (let d = 0; d < coVung; d++){
        const p = modv(c+d, NS);
        if (daLay.has(p)){ ok = false; break; }
        s += tt.dem[p];
      }
      if (ok && s > best){ best = s; tot = c; }
    }
    if (tot < 0) break;
    const cac = [];
    for (let d = 0; d < coVung; d++){ const p = modv(tot+d, NS); daLay.add(p); cac.push(WHEEL[p]); }
    vung.push({tam: WHEEL[modv(tot + Math.floor(coVung/2), NS)], cac: cac, tan: best, viTri: tot});
  }
  const hop = new Set();
  for (const v of vung) for (const x of v.cac) hop.add(x);
  return {vung: vung, hop: hop, phu: hop.size,
          kyVong: tt.n * hop.size / NS,
          khoang: vung.length === 2 ? khoangCach(vung[0].viTri, vung[1].viTri) : null};
}
function khoangCach(a, b){ const d = Math.abs(a-b); return Math.min(d, NS-d); }

/* Thống kê chi bình phương toàn bánh xe + giá trị p (xấp xỉ Wilson–Hilferty).          */
function chi2Wheel(tt){
  if (tt.n < 100) return null;
  const exp = tt.n / NS;
  let x = 0;
  for (let i = 0; i < NS; i++){ const d = tt.dem[i] - exp; x += d*d/exp; }
  const df = NS - 1;
  const z = (Math.pow(x/df, 1/3) - (1 - 2/(9*df))) / Math.sqrt(2/(9*df));
  return {x:x, df:df, p:1 - phi(z), z:z};
}
function phi(z){
  const t = 1/(1 + 0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  const p = d*t*(0.3193815 + t*(-0.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return z > 0 ? 1 - p : p;
}

/* =====================================================================================
   PHẦN 4 — THEO DÕI, CHẤM ĐIỂM, HIỆU QUẢ
   ===================================================================================== */
function theoDoi(spins, cfg){
  const bd = cfg.BAT_DAU, n = spins.length;
  const tt = ttMoi();
  const cham = {}; for (const t of TEN_E) cham[t] = [];
  let vao = 0, trung = 0, dv = 0, trungCung = 0, hitZero = 0;
  let chonHienTai = null, cungHienTai = null;
  /* chuỗi thua liên tiếp — đếm từ vòng BAT_DAU+1, tức vòng đầu tiên được chấm */
  let missHT = 0, missMax = 0, missKet = 0, hitHT = 0, hitMax = 0;
  let cMissHT = 0, cMissMax = 0, cMissKet = 0, cHitHT = 0, cHitMax = 0;

  for (let i = 0; i < n; i++){
    if (tt.n >= bd){
      const chon = chonSau(tt);
      const cung = cacVung(tt, cfg.CO_VUNG, cfg.SO_VUNG);
      const so = spins[i];
      const k = (so in ST_OF) ? ST_OF[so] : -1;
      vao++;
      const ok = chon.some(c => c.street === k);
      trung += ok ? 1 : 0;
      dv += ok ? 6 : -6;
      if (ok){ missHT = 0; hitHT++; if (hitHT > hitMax) hitMax = hitHT; }
      else { hitHT = 0; missHT++; if (missHT > missMax){ missMax = missHT; missKet = tt.n + 1; } }
      if (so === 0) hitZero++;
      const okC = !!(cung && cung.hop.has(so));
      if (okC) trungCung++;
      if (okC){ cMissHT = 0; cHitHT++; if (cHitHT > cHitMax) cHitMax = cHitHT; }
      else { cHitHT = 0; cMissHT++; if (cMissHT > cMissMax){ cMissMax = cMissHT; cMissKet = tt.n + 1; } }
      for (const c of chon) cham[c.ten].push([tt.n, c.street === k]);
    }
    ttCapNhat(tt, spins[i]);
  }
  if (tt.n >= bd){ chonHienTai = chonSau(tt); cungHienTai = cacVung(tt, cfg.CO_VUNG, cfg.SO_VUNG); }
  return {tt, cham, vao, trung, dv, trungCung, hitZero, chon:chonHienTai, cung:cungHienTai,
          missMax, missKet, missHT, hitMax,
          cMissMax, cMissKet, cMissHT, cHitMax};
}
/* Kỳ vọng độ dài chuỗi liên tiếp dài nhất của một biến cố xác suất q trong n lần thử.
   Đã kiểm chứng với mô phỏng 4.000 lượt, sai lệch dưới 0,07 ở mọi cỡ phủ.            */
function kyVongChuoiDaiNhat(n, q){
  if (n < 2 || q <= 0 || q >= 1) return 0;
  const L = Math.log(1/q);
  return Math.log(n*(1-q))/L + 0.5772156649/L - 0.5;
}
function machCua(ds){
  let m = 0;
  for (let i = ds.length - 1; i >= 0; i--){ if (!ds[i][1]) break; m++; }
  return m;
}

/* =====================================================================================
   PHẦN 5 — MÔ PHỎNG BÁNH XE CÂN ĐỂ ĐO NGƯỠNG NHIỄU
   ===================================================================================== */
function mkRng(seed){
  let s = seed >>> 0;
  return function(){ s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
                     return s / 4294967296; };
}
function nguongNhieu(cfg, soPhien, vongMoiPhien){
  const rnd = mkRng(20260904);
  let vao = 0, trung = 0, trungCung = 0;
  const eng = {}; for (const t of TEN_E) eng[t] = {d:0, n:0};
  for (let p = 0; p < soPhien; p++){
    const spins = [];
    for (let i = 0; i < vongMoiPhien; i++) spins.push(WHEEL[Math.floor(rnd()*NS)]);
    const r = theoDoi(spins, cfg);
    vao += r.vao; trung += r.trung; trungCung += r.trungCung;
    for (const t of TEN_E){
      for (const c of r.cham[t]){ eng[t].n++; if (c[1]) eng[t].d++; }
    }
  }
  if (!vao) return null;
  const tl = trung / vao;
  return {vao, tyLe:tl, se:Math.sqrt(tl*(1-tl)/vao), cung:trungCung/vao, eng};
}

function khoiChuoi(tieuDe, phu, missMax, missKet, missHT, hitMax, vao, cuoc, bat){

    '<div><div class="nhan">Đang miss</div><div class="gt"' +
    (missHT >= Math.round(kv) ? ' style="color:var(--cung)"' : "") + ">" + missHT +
    '<span class="small muted"> vòng</span></div></div>' +
    '<div><div class="nhan">Thắng liên tiếp dài nhất</div><div class="gt">' + hitMax +
    '<span class="small muted"> vòng</span></div></div>' +
    '<div><div class="nhan">Kỳ vọng bánh xe cân</div><div class="gt">~' + kv.toFixed(1) +
    '<span class="small muted"> / ' + vao + " vòng chấm</span></div></div></div>" +
    '<div class="dien-giai">Chuỗi miss dài nhất ngốn <b>' + (missMax*phu).toLocaleString("vi-VN") +
    ' đơn vị</b> liên tiếp, tức ' + (missMax*phu*cuoc).toLocaleString("vi-VN") + 'đ. ' +
    (cao ? "Vượt kỳ vọng khá xa, nhưng chuỗi dài nhất là đại lượng đuôi nên dao động rất mạnh."
         : "Đang nằm quanh mức một bánh xe cân tự tạo ra.") +
    " Phủ " + phu + " số nghĩa là mỗi vòng trượt với xác suất " + (q*100).toFixed(1) +
    "%, nên chuỗi thua dài là bình thường.</div></div></section>";
}
function khoiTyLe(tieuDe, trung, vao, phu, cuoc){
  const p = vao ? trung/vao : 0, se = vao ? Math.sqrt(p*(1-p)/vao) : 0;
  const kv = phu/37, hv = phu/36;
  const ev = p*(35-(phu-1))/phu + (1-p)*(-1);
  return "<section><h2>" + tieuDe + "</h2><div class=\"hop\"><div class=\"so-lieu\">" +
    '<div><div class="nhan">Vòng đã chấm</div><div class="gt">' + vao + "</div></div>" +
    '<div><div class="nhan">Tỷ lệ trúng</div><div class="gt">' + (p*100).toFixed(1) +
    '%<span class="small muted"> \u00b1' + (se*100).toFixed(1) + "</span></div></div>" +
    '<div><div class="nhan">Kỳ vọng bánh xe cân</div><div class="gt">' + (kv*100).toFixed(1) + "%</div></div>" +
    '<div><div class="nhan">Ngưỡng hoà vốn</div><div class="gt">' + (hv*100).toFixed(1) + "%</div></div>" +
    '<div><div class="nhan">EV thực tế</div><div class="gt" style="color:' +
    (ev > 0 ? "var(--chon)" : "var(--nga)") + '">' + (ev >= 0 ? "+" : "") + (ev*100).toFixed(2) + "%</div></div>" +
    "</div>" +
    '<div class="dien-giai">Đặt ' + cuoc.toLocaleString("vi-VN") + 'đ mỗi số, tức ' +
    (cuoc*phu).toLocaleString("vi-VN") + 'đ mỗi vòng. Trúng thì lãi đúng 100% tiền đặt, ' +
    'trượt thì mất trọn. Cần vượt ngưỡng hoà vốn mới có lãi, và trên bánh xe cân điều đó ' +
    'không xảy ra dù chọn cỡ phủ nào.</div></div></section>';
}

function doNguongNhieu(){
  const b = $("nutNhieu");
  b.disabled = true; b.textContent = "Đang chạy\u2026";
  setTimeout(() => {
    const cfg = cauHinh(), r = nguongNhieu(cfg, 60, 400);
    let h = "";
    if (!r) h = '<div class="trong">Không đo được.</div>';
    else {
      const phuC = cfg.SO_VUNG * cfg.CO_VUNG;
      h = '<div class="hop" style="margin-top:12px"><div class="so-lieu">' +
        '<div><div class="nhan">Vòng mô phỏng</div><div class="gt">' + r.vao.toLocaleString("vi-VN") + "</div></div>" +
        '<div><div class="nhan">6 street trúng</div><div class="gt">' + (r.tyLe*100).toFixed(2) +
        '%<span class="small muted"> / kv 48,65%</span></div></div>' +
        '<div><div class="nhan">Vùng hàng xóm trúng</div><div class="gt">' + (r.cung*100).toFixed(2) +
        '%<span class="small muted"> / kv ' + (phuC/37*100).toFixed(2) + "%</span></div></div></div>" +
        '<div class="dien-giai">Chạy đúng hai phương án này trên bánh xe châu Âu hoàn toàn cân. ' +
        "Con số bám quanh kỳ vọng nghĩa là không phương án nào chứa thông tin, và đó là điều " +
        "phải xảy ra khi không có lệch vật lý.</div></div>";
    }
    $("ketQuaNhieu").innerHTML = h;
    b.disabled = false; b.textContent = "Đo ngưỡng nhiễu";
  }, 30);
}
