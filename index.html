<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Baccarat">
<title>Baccarat — 6 engine độc lập</title>
<style>
/* ===================================================================================
   Bảng màu lấy từ bàn baccarat thật: nền nỉ xanh đen, vòng đỏ Banker, vòng xanh Player,
   chữ màu ngà như phiếu ghi cầu in sẵn ở sòng.
   =================================================================================== */
:root{
  --ni:#0E1512;          /* nền nỉ */
  --panel:#16201B;       /* mặt bảng */
  --panel-2:#1D2A24;     /* mặt bảng nổi */
  --line:#26332C;        /* kẻ mảnh */
  --nga:#E7E4DA;         /* chữ chính */
  --nga-mo:#8A968E;      /* chữ phụ */
  --banker:#E03B3B;
  --banker-tram:#8E2020;
  --player:#2D7FF0;
  --player-tram:#164C93;
  --tie:#17A673;
  --cho:#55635B;
  --cho-tram:#39443E;
  --dung:#17A673;
  --sai:#3A4640;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ni);
  color:var(--nga);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
  font-variant-numeric:tabular-nums;
  padding:14px 14px 40px;
  max-width:760px;
  margin:0 auto;
}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
.muted{color:var(--nga-mo)}
.small{font-size:12px}
.tiny{font-size:11px}

/* --- thanh đầu trang: đếm ván trong shoe --- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.dem{font-size:15px;font-weight:600}
.dem b{font-size:22px}
.thanh{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:8px 0 16px}
.thanh > div{height:100%;background:var(--nga-mo);transition:width .25s}
.thanh.gan-het > div{background:#D9A227}
.thanh.het > div{background:var(--banker)}

/* --- khối phán quyết: mảng màu lớn, không bo giống card, để nó khác hẳn phần còn lại --- */
.phan-quyet{border-radius:var(--r);padding:20px;margin-bottom:12px}
.phan-quyet .van{font-size:12px;opacity:.82;letter-spacing:.4px}
.phan-quyet .lon{font-size:32px;font-weight:700;line-height:1.1;margin:4px 0 6px;color:#fff}
.phan-quyet .vi-sao{font-size:13px;color:rgba(255,255,255,.88)}
.bg-B{background:linear-gradient(158deg,var(--banker),var(--banker-tram))}
.bg-P{background:linear-gradient(158deg,var(--player),var(--player-tram))}
.bg-{background:linear-gradient(158deg,var(--cho),var(--cho-tram))}

/* --- hai tín hiệu --- */
.doi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:460px){.doi{grid-template-columns:1fr}}
.o-tin-hieu{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.o-tin-hieu .nhan{font-size:12px;color:var(--nga-mo)}
.o-tin-hieu .ly-do{font-size:12px;color:var(--nga-mo);margin-top:6px;line-height:1.5}
.chip{display:inline-block;border-radius:6px;padding:3px 12px;font-weight:700;font-size:14px;color:#fff;margin-top:7px}
.chip.s{padding:1px 8px;font-size:12px;margin:0}
.c-B{background:var(--banker)}.c-P{background:var(--player)}.c-{background:var(--cho)}

/* --- khu vực nội dung --- */
section{margin-bottom:18px}
section > h2{font-size:13px;font-weight:600;color:var(--nga-mo);margin:0 0 8px}

/* --- bảng engine: hàng kẻ mảnh, không phải card --- */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--nga-mo);text-align:left;padding:0 8px 7px;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr.dan-dau td{background:rgba(231,228,218,.045)}
.ten-engine{font-size:13px;font-weight:500}
.ghi-chu{font-size:11px;color:var(--nga-mo);margin-top:1px}
.mach{font-size:17px;font-weight:700}
.mach.im{color:var(--nga-mo);font-weight:400}
.cham{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:3px}
.cham.d{background:var(--dung)}.cham.s{background:#3A4640}

/* --- big road --- */
.road{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px;overflow-x:auto}
.road-hang{height:26px;white-space:nowrap}
.o{width:26px;height:26px;display:inline-block;position:relative;vertical-align:top}
.o i{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;border:2.5px solid;box-sizing:border-box}
.o u{position:absolute;inset:0;color:var(--tie);font-style:normal;font-weight:800;font-size:20px;line-height:26px;text-align:center}
.dong-cau{white-space:nowrap;margin:5px 0;display:flex;align-items:center}
.nhan-cau{display:inline-block;width:96px;flex:0 0 96px;font-size:11px;color:var(--nga-mo)}
.cham-cau{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:3px;flex:0 0 11px}

/* --- thống kê --- */
.so-lieu{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.so-lieu .nhan{font-size:11px;color:var(--nga-mo)}
.so-lieu .gia-tri{font-size:19px;font-weight:600;margin-top:2px}
.dien-giai{font-size:12px;color:var(--nga-mo);line-height:1.65;margin-top:10px}

/* --- cài đặt --- */
.cai-dat{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--nga-mo)}
.cai-dat label{display:flex;align-items:center;gap:7px}
.cai-dat input[type=number]{width:96px}
input,select,textarea{background:var(--panel-2);color:var(--nga);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;font:inherit;font-size:13px}
textarea{width:100%;height:64px;resize:vertical;line-height:1.7;letter-spacing:1px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #D9A227;outline-offset:2px}

/* --- thanh nhập liệu, nằm giữa trang ngay dưới big road --- */
.nhap{display:flex;gap:8px;margin:4px 0 20px}
.nhap button{flex:1;height:64px;border:0;border-radius:var(--r);font-size:24px;font-weight:700;
  color:#fff;cursor:pointer;font-family:inherit;touch-action:manipulation;user-select:none;
  -webkit-user-select:none}
.nhap button:active{transform:translateY(1px)}
.b-B{background:var(--banker)}.b-P{background:var(--player)}.b-T{background:var(--tie)}
.b-phu{flex:0 0 62px !important;background:var(--panel-2);color:var(--nga-mo);font-size:13px !important;
  font-weight:500 !important}
.nut-nho{background:var(--panel-2);color:var(--nga);border:1px solid var(--line);border-radius:7px;
  padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
.nut-nho:hover{border-color:var(--nga-mo)}

.trong{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  text-align:center;color:var(--nga-mo);font-size:13px;line-height:1.7}
kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px}
</style>
</head>
<body>

<div class="top">
  <h1>Baccarat — 6 engine độc lập</h1>
  <div class="dem"><b id="soVan">0</b><span class="muted"> / 75 ván</span></div>
</div>
<div class="thanh" id="thanhShoe"><div style="width:0"></div></div>

<div id="phanTren"></div>

<div class="nhap">
  <button class="b-P" onclick="them('P')">P</button>
  <button class="b-T" onclick="them('T')">T</button>
  <button class="b-B" onclick="them('B')">B</button>
  <button class="b-phu" onclick="xoa1()">Xoá 1</button>
</div>

<div id="phanDuoi"></div>

<section>
  <h2>Chuỗi đang theo dõi</h2>
  <textarea id="oChuoi" spellcheck="false" placeholder="Dán chuỗi cũ → mới, ví dụ: B P T B B P …"></textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
    <button class="nut-nho" onclick="dungChuoi()">Dùng chuỗi này</button>
    <button class="nut-nho" onclick="shoeMoi()">Shoe mới</button>
    <button class="nut-nho" onclick="chayNguongNhieu()" id="nutNhieu">Đo ngưỡng nhiễu</button>
  </div>
  <div id="ketQuaNhieu"></div>
</section>

<section>
  <h2>Cài đặt</h2>
  <div class="cai-dat">
    <label>Mạch tối thiểu
      <input type="number" id="oMach" value="2" min="1" max="6" onchange="ve()"></label>
    <label>Bắt đầu theo dõi từ ván
      <input type="number" id="oBatDau" value="15" min="5" max="60" onchange="ve()"></label>
    <label>Tiền cược
      <input type="number" id="oCuoc" value="100000" step="10000" onchange="ve()"></label>
  </div>
  <p class="small muted" style="margin:10px 0 0">
    Phím tắt: <kbd>P</kbd> <kbd>T</kbd> <kbd>B</kbd> để nhập, <kbd>Backspace</kbd> để xoá ván cuối.
    Chuỗi được lưu lại trong trình duyệt, đóng tab mở lại vẫn còn.
  </p>
</section>

<script>
"use strict";
/* =====================================================================================
   PHẦN 1 — ENGINE. Chuyển nguyên văn từ bản Python v4, giữ đúng từng công thức.
   ===================================================================================== */
const KY_HIEU = ["B","P","T"], CUA = ["B","P"];
const TEN_DAY_DU = {B:"BANKER", P:"PLAYER", T:"TIE", "-":"CHỜ"};
const P_LT = {B:0.458597, P:0.446247, T:0.095156};
const P_B_KHONG_TIE = P_LT.B / (P_LT.B + P_LT.P);
const VAN_TOI_DA = 75;

const nguoc = x => x === "B" ? "P" : "B";

function docLichSu(raw){
  return String(raw || "").toUpperCase().split("").filter(c => c === "B" || c === "P" || c === "T");
}
function chuanHoa(d){
  const o = {}; let s = 0;
  for (const k of KY_HIEU){ o[k] = Math.max(d[k] || 0, 1e-9); s += o[k]; }
  for (const k of KY_HIEU) o[k] /= s;
  return o;
}
function shrink(dem, n, alpha){
  const o = {};
  for (const k of KY_HIEU) o[k] = ((dem[k] || 0) + alpha * P_LT[k]) / (n + alpha);
  return chuanHoa(o);
}

/* --- Big Road --- */
function bigRoad(seq){
  const cot = [];
  for (const x of seq){
    if (x === "T") continue;
    if (!cot.length || cot[cot.length-1][0] !== x) cot.push([x]);
    else cot[cot.length-1].push(x);
  }
  return cot;
}
function bigRoadO(seq){
  const o = []; let tieDau = 0;
  for (const x of seq){
    if (x === "T"){ if (o.length) o[o.length-1].tie++; else tieDau++; continue; }
    o.push({v:x, tie:0});
  }
  if (o.length && tieDau) o[0].tie += tieDau;
  return o;
}
function luoiBigRoad(seq, soHang){
  soHang = soHang || 6;
  const luoi = new Map(), ds = bigRoadO(seq);
  let c = -1, r = -1, cotGoc = -1, truoc = null, maxC = -1;
  const co = (a,b) => luoi.has(a + "," + b);
  for (const o of ds){
    if (o.v !== truoc){
      cotGoc++; c = cotGoc; r = 0;
      while (co(c,r)) c++;
    } else {
      if (r + 1 < soHang && !co(c, r+1)) r++;
      else { c++; while (co(c,r)) c++; }
    }
    luoi.set(c + "," + r, o);
    if (c > maxC) maxC = c;
    truoc = o.v;
  }
  return {luoi, soCot: maxC + 1};
}
function mauCauPhaiSinh(cot, lui){
  const mau = [];
  for (let c = 0; c < cot.length; c++){
    for (let r = 0; r < cot[c].length; r++){
      if (r === 0){
        const i = c - lui, j = c - lui - 1;
        if (j < 0) continue;
        mau.push(cot[i].length === cot[j].length ? "R" : "X");
      } else {
        const i = c - lui;
        if (i < 0) continue;
        mau.push(cot[i].length > r ? "R" : "X");
      }
    }
  }
  return mau;
}

/* --- 6 engine, mỗi engine tự quyết, không biết gì về 5 engine kia --- */
function chonTu(p){ return p.B >= p.P ? "B" : "P"; }

function mkMarkov(k){
  return {
    ten: "Markov-" + k,
    _dem(seq){
      const khoa = seq.slice(-k).join("");
      const dem = {}; let n = 0;
      for (let i = 0; i < seq.length - k; i++){
        if (seq.slice(i, i+k).join("") === khoa){ dem[seq[i+k]] = (dem[seq[i+k]]||0) + 1; n++; }
      }
      return {khoa, dem, n};
    },
    duBao(seq, cfg){
      if (seq.length <= k) return Object.assign({}, P_LT);
      const {dem, n} = this._dem(seq);
      return shrink(dem, n, cfg.PSEUDO);
    },
    chon(seq, cfg){ return chonTu(this.duBao(seq, cfg)); },
    moTa(seq){
      if (seq.length <= k) return "chưa đủ dữ liệu";
      const {khoa, n} = this._dem(seq);
      return "khoá " + khoa + ", " + n + " mẫu";
    }
  };
}

const eNGram = {
  ten: "N-Gram",
  _tim(seq){
    for (let L = 5; L >= 1; L--){
      if (seq.length <= L) continue;
      const khoa = seq.slice(-L).join("");
      const dem = {}; let n = 0;
      for (let i = 0; i < seq.length - L; i++){
        if (seq.slice(i, i+L).join("") === khoa){ dem[seq[i+L]] = (dem[seq[i+L]]||0) + 1; n++; }
      }
      if (n >= 2) return {khoa, dem, n};
    }
    return null;
  },
  duBao(seq, cfg){
    const r = this._tim(seq);
    return r ? shrink(r.dem, r.n, cfg.PSEUDO) : Object.assign({}, P_LT);
  },
  chon(seq, cfg){ return chonTu(this.duBao(seq, cfg)); },
  moTa(seq){
    const r = this._tim(seq);
    return r ? "mẫu " + r.khoa + ", " + r.n + " lần" : "không có mẫu lặp";
  }
};

const eStreak = {
  ten: "Streak/Chop",
  _do(seq){
    const s = seq.filter(x => x !== "T");
    if (s.length < 4) return null;
    const kyTu = s[s.length-1];
    let L = 1;
    while (L < s.length && s[s.length-1-L] === kyTu) L++;
    let tiep = 0, tong = 0, run = 1;
    for (let i = 1; i < s.length - 1; i++){
      run = (s[i] === s[i-1]) ? run + 1 : 1;
      if (run >= L && s[i] === kyTu){ tong++; if (s[i+1] === kyTu) tiep++; }
    }
    return {kyTu, L, tiep, tong};
  },
  duBao(seq, cfg){
    const r = this._do(seq);
    if (!r) return Object.assign({}, P_LT);
    const pLt = r.kyTu === "B" ? P_B_KHONG_TIE : 1 - P_B_KHONG_TIE;
    const a = cfg.PSEUDO;
    const pTiep = (r.tiep + a * pLt) / (r.tong + a);
    const pt = P_LT.T, o = {T: pt};
    o[r.kyTu] = pTiep * (1 - pt);
    o[nguoc(r.kyTu)] = (1 - pTiep) * (1 - pt);
    return chuanHoa(o);
  },
  chon(seq, cfg){ return chonTu(this.duBao(seq, cfg)); },
  moTa(seq){
    const r = this._do(seq);
    if (!r) return "chưa đủ dữ liệu";
    return "bệt " + r.L + " ván " + r.kyTu + ", quá khứ " + r.tiep + "/" + r.tong + " tiếp";
  }
};

const eRoads = {
  ten: "DerivedRoads",
  _diem(seq){
    const cot = bigRoad(seq);
    let d = 0;
    for (const lui of [1,2,3]){
      const m = mauCauPhaiSinh(cot, lui).slice(-3).reverse();
      m.forEach((x, i) => { d += (3 - i) * (x === "R" ? 1 : -1); });
    }
    return d;
  },
  _chenh(seq){
    const s = seq.filter(x => x !== "T");
    if (s.length < 8) return {chenh:null, s};
    return {chenh: this._diem(s.concat(["B"])) - this._diem(s.concat(["P"])), s};
  },
  duBao(seq){
    const {chenh, s} = this._chenh(seq);
    if (chenh === null) return Object.assign({}, P_LT);
    const pt = P_LT.T;
    let pb;
    if (chenh === 0) pb = s[s.length-1] === "B" ? 0.55 : 0.45;
    else pb = Math.min(Math.max(0.5 + 0.018 * chenh, 0.05), 0.95);
    return chuanHoa({B: pb * (1-pt), P: (1-pb) * (1-pt), T: pt});
  },
  chon(seq, cfg){ return chonTu(this.duBao(seq, cfg)); },
  moTa(seq){
    const {chenh} = this._chenh(seq);
    if (chenh === null) return "chưa đủ cột";
    return chenh === 0 ? "3 cầu hoà, bám ván cuối"
                       : "điểm đỏ chênh " + (chenh > 0 ? "+" : "") + chenh;
  }
};

const eSoiCau = {
  ten: "SoiCau",
  _doc(seq){
    const s = seq.filter(x => x !== "T"), cot = bigRoad(seq);
    if (cot.length < 2 || s.length < 6) return {ten:null, chon:null};
    const L = cot.map(c => c.length), hien = cot[cot.length-1][0], n = L.length;
    if (L[n-1] >= 3) return {ten: "bệt " + L[n-1] + " ván", chon: hien};
    if (n >= 4 && L[n-1] === 1 && L[n-2] === 1 && L[n-3] === 1 && L[n-4] === 1)
      return {ten: "cầu 1-1", chon: nguoc(hien)};
    if (n >= 3 && L[n-3] === 2 && L[n-2] === 2){
      if (L[n-1] === 1) return {ten: "cầu 2-2", chon: hien};
      if (L[n-1] === 2) return {ten: "cầu 2-2", chon: nguoc(hien)};
    }
    if (n >= 3 && L[n-3] + 1 === L[n-2] && L[n-3] >= 1){
      const mt = L[n-2] + 1;
      return {ten: "cầu tăng " + L[n-3] + "-" + L[n-2] + "-" + mt,
              chon: L[n-1] < mt ? hien : nguoc(hien)};
    }
    const gan = s.slice(-12);
    if (gan.length >= 8){
      const tb = gan.filter(x => x === "B").length / gan.length;
      if (tb >= 0.65) return {ten: "nghiêng B " + Math.round(tb*100) + "%", chon: "B"};
      if (tb <= 0.35) return {ten: "nghiêng P " + Math.round((1-tb)*100) + "%", chon: "P"};
    }
    const g10 = s.slice(-10), nb = g10.filter(x => x === "B").length;
    return {ten: "đa số gần đây", chon: nb >= g10.length - nb ? "B" : "P"};
  },
  duBao(seq){
    const r = this._doc(seq);
    if (!r.chon) return Object.assign({}, P_LT);
    const pt = P_LT.T, pb = r.chon === "B" ? 0.62 : 0.38;
    return chuanHoa({B: pb * (1-pt), P: (1-pb) * (1-pt), T: pt});
  },
  chon(seq){
    const r = this._doc(seq);
    return r.chon || "B";
  },
  moTa(seq){ return this._doc(seq).ten || "chưa đủ cột"; }
};

const ENGINES = [mkMarkov(1), mkMarkov(2), eNGram, eStreak, eRoads, eSoiCau];
const TEN_ENGINE = ENGINES.map(e => e.ten);

/* =====================================================================================
   PHẦN 2 — THEO DÕI, CHẤM ĐIỂM, LUẬT 2 TÍN HIỆU
   ===================================================================================== */
function theoDoi(seq, cfg){
  const n = seq.length, bd = cfg.BAT_DAU;
  const duBao = {}, cham = {};
  for (const t of TEN_ENGINE) cham[t] = [];
  if (n < bd) return {duBao, cham};
  for (let t = bd; t <= n; t++){
    const qk = seq.slice(0, t), d = {};
    for (const e of ENGINES) d[e.ten] = e.chon(qk, cfg);
    duBao[t] = d;
    if (t < n && seq[t] !== "T"){
      for (const e of ENGINES) cham[e.ten].push([t, d[e.ten] === seq[t]]);
    }
  }
  return {duBao, cham};
}
function machCua(ds){
  let m = 0;
  for (let i = ds.length - 1; i >= 0; i--){ if (!ds[i][1]) break; m++; }
  return m;
}
function tinHieu(duBaoNay, cham, cfg){
  const bang = {};
  for (const t of TEN_ENGINE){
    const ds = cham[t];
    bang[t] = {mach: machCua(ds), dung: ds.filter(x => x[1]).length, tong: ds.length};
  }
  let machMax = 0;
  for (const t of TEN_ENGINE) if (bang[t].mach > machMax) machMax = bang[t].mach;

  let th1 = "-", chuTh1 = "chưa có mạch nào đạt tối thiểu", ungVien = [];
  if (machMax >= cfg.MACH_TOI_THIEU){
    ungVien = TEN_ENGINE.filter(t => bang[t].mach === machMax);
    if (ungVien.length > 1){
      const dMax = Math.max(...ungVien.map(t => bang[t].dung));
      ungVien = ungVien.filter(t => bang[t].dung === dMax);
    }
    if (ungVien.length === 1){
      th1 = duBaoNay[ungVien[0]];
      chuTh1 = ungVien[0] + ", mạch " + machMax + ", tổng " + bang[ungVien[0]].dung + " lần đúng";
    } else {
      const ds = new Set(ungVien.map(t => duBaoNay[t]));
      if (ds.size === 1){
        th1 = [...ds][0];
        chuTh1 = ungVien.length + " engine đồng hạng mạch " + machMax + ", cùng đề xuất";
      } else {
        chuTh1 = ungVien.length + " engine đồng hạng mạch " + machMax + ", đề xuất ngược nhau";
      }
    }
  }
  const phieu = {B:0, P:0};
  for (const t of TEN_ENGINE) phieu[duBaoNay[t]]++;
  let th2, chuTh2;
  if (phieu.B > phieu.P){ th2 = "B"; chuTh2 = "phiếu " + phieu.B + "–" + phieu.P + " nghiêng Banker"; }
  else if (phieu.P > phieu.B){ th2 = "P"; chuTh2 = "phiếu " + phieu.P + "–" + phieu.B + " nghiêng Player"; }
  else { th2 = "-"; chuTh2 = "phiếu hoà " + phieu.B + "–" + phieu.P; }

  const quyet = (th1 !== "-" && th1 === th2) ? th1 : "-";
  return {th1, chuTh1, th2, chuTh2, quyet, bang, phieu, ungVien, machMax};
}

function hieuQuaLuat(seq, cfg, duBao){
  const n = seq.length, bd = cfg.BAT_DAU;
  if (!duBao) duBao = theoDoi(seq, cfg).duBao;
  if (n < bd + 2) return null;
  const cham = {}; for (const t of TEN_ENGINE) cham[t] = [];
  let vao = 0, trung = 0, cho = 0, bankKhiVao = 0, tongCham = 0, bankTong = 0;
  for (let m = bd; m < n; m++){
    if (duBao[m]){
      const kq = tinHieu(duBao[m], cham, cfg);
      if (seq[m] !== "T"){
        if (kq.quyet !== "-"){
          vao++;
          if (kq.quyet === seq[m]) trung++;
          if (seq[m] === "B") bankKhiVao++;
        } else cho++;
      }
    }
    if (seq[m] !== "T"){
      tongCham++;
      if (seq[m] === "B") bankTong++;
      for (const e of ENGINES) if (duBao[m]) cham[e.ten].push([m, duBao[m][e.ten] === seq[m]]);
    }
  }
  if (vao === 0) return {vao:0, cho, tongCham};
  const tl = trung / vao;
  return {vao, trung, tyLe: tl, se: Math.sqrt(tl*(1-tl)/vao), cho,
          bankKhiVao: bankKhiVao/vao, bankTong: bankTong/Math.max(tongCham,1), tongCham};
}

/* =====================================================================================
   PHẦN 3 — MÔ PHỎNG SHOE 8 BỘ BÀI ĐÚNG LUẬT PUNTO BANCO (để đo ngưỡng nhiễu)
   ===================================================================================== */
function mkRng(seed){
  let s = seed >>> 0;
  return function(){
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}
function moPhongShoe(rnd){
  const bo = [1,2,3,4,5,6,7,8,9,0,0,0,0];
  const shoe = [];
  for (let d = 0; d < 8; d++) for (let s = 0; s < 4; s++) shoe.push(...bo);
  for (let i = shoe.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i+1));
    const t = shoe[i]; shoe[i] = shoe[j]; shoe[j] = t;
  }
  let i = 0; const kq = [];
  while (i <= shoe.length - 20){
    let pt = (shoe[i] + shoe[i+2]) % 10, bt = (shoe[i+1] + shoe[i+3]) % 10;
    i += 4;
    if (pt < 8 && bt < 8){
      let la3 = null;
      if (pt <= 5){ la3 = shoe[i++]; pt = (pt + la3) % 10; }
      if (la3 === null){ if (bt <= 5){ bt = (bt + shoe[i++]) % 10; } }
      else {
        const rut = bt <= 2 || (bt === 3 && la3 !== 8) ||
                    (bt === 4 && la3 >= 2 && la3 <= 7) ||
                    (bt === 5 && la3 >= 4 && la3 <= 7) ||
                    (bt === 6 && (la3 === 6 || la3 === 7));
        if (rut) bt = (bt + shoe[i++]) % 10;
      }
    }
    kq.push(bt > pt ? "B" : (pt > bt ? "P" : "T"));
  }
  return kq;
}
function nullTestLuat(cfg, soShoe){
  const rnd = mkRng(cfg.SEED || 20260904);
  let vao = 0, trung = 0, bank = 0, tong = 0, nShoe = 0;
  for (let k = 0; k < soShoe; k++){
    const kq = moPhongShoe(rnd).slice(0, VAN_TOI_DA);
    const r = hieuQuaLuat(kq, cfg);
    if (!r || !r.vao) continue;
    vao += r.vao; trung += r.trung;
    bank += r.bankTong * r.tongCham; tong += r.tongCham; nShoe++;
  }
  if (!vao) return null;
  const tl = trung / vao;
  return {vao, tyLe: tl, se: Math.sqrt(tl*(1-tl)/vao), bank: bank/Math.max(tong,1), nShoe};
}

/* =====================================================================================
   PHẦN 4 — GIAO DIỆN
   ===================================================================================== */
let SEQ = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function cauHinh(){
  return {
    BAT_DAU: Math.max(5, parseInt($("oBatDau").value) || 15),
    MACH_TOI_THIEU: Math.max(1, parseInt($("oMach").value) || 2),
    CUOC: Math.max(0, parseInt($("oCuoc").value) || 0),
    PSEUDO: 12.0,
    HOA_HONG: 0.05,
    SEED: 20260904
  };
}
function luu(){
  try{ localStorage.setItem("bacc_seq", SEQ.join("")); }catch(e){}
}
function doc(){
  try{ return docLichSu(localStorage.getItem("bacc_seq") || ""); }catch(e){ return []; }
}
function them(k){
  SEQ.push(k); luu(); ve();
}
function xoa1(){ SEQ.pop(); luu(); ve(); }
function shoeMoi(){
  if (SEQ.length && !confirm("Xoá toàn bộ " + SEQ.length + " ván để bắt đầu shoe mới?")) return;
  SEQ = []; luu(); ve();
}
function dungChuoi(){ SEQ = docLichSu($("oChuoi").value); luu(); ve(); }

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toUpperCase();
  if (k === "B" || k === "P" || k === "T"){ them(k); e.preventDefault(); }
  else if (e.key === "Backspace"){ xoa1(); e.preventDefault(); }
});

function veBigRoad(seq){
  const {luoi, soCot} = luoiBigRoad(seq, 6);
  const bd = Math.max(0, soCot - 22);
  let h = "";
  for (let r = 0; r < 6; r++){
    h += '<div class="road-hang">';
    for (let c = bd; c < soCot; c++){
      const o = luoi.get(c + "," + r);
      if (!o){ h += '<span class="o"></span>'; continue; }
      const mau = o.v === "B" ? "var(--banker)" : "var(--player)";
      h += '<span class="o"><i style="border-color:' + mau + '"></i>' +
           (o.tie ? "<u>╱</u>" : "") + "</span>";
    }
    h += "</div>";
  }
  return '<div class="road">' + h + "</div>";
}
function veCauPhaiSinh(seq){
  const cot = bigRoad(seq);
  let h = "";
  for (const [lui, nhan] of [[1,"Big eye boy"],[2,"Small road"],[3,"Cockroach"]]){
    const m = mauCauPhaiSinh(cot, lui).slice(-26);
    const cham = m.length
      ? m.map(x => '<span class="cham-cau" style="background:' +
          (x === "R" ? "var(--banker)" : "var(--player)") + '"></span>').join("")
      : '<span class="tiny muted">chưa đủ cột</span>';
    h += '<div class="dong-cau"><span class="nhan-cau">' + nhan + "</span>" + cham + "</div>";
  }
  return '<div style="margin-top:9px">' + h + "</div>";
}
function dayCham(ds){
  if (!ds.length) return '<span class="tiny muted">chưa chấm</span>';
  return ds.slice(-12).map(x => '<span class="cham ' + (x[1] ? "d" : "s") + '"></span>').join("");
}
const chip = (c, nho) => '<span class="chip ' + (nho ? "s " : "") + "c-" + (c === "-" ? "" : c) +
  '">' + (c === "-" ? "Chờ" : c) + "</span>";

function ve(){
  const cfg = cauHinh(), n = SEQ.length;
  $("soVan").textContent = n;
  const pct = Math.min(100, n / VAN_TOI_DA * 100);
  const th = $("thanhShoe");
  th.firstElementChild.style.width = pct + "%";
  th.className = "thanh" + (n >= VAN_TOI_DA ? " het" : n >= 68 ? " gan-het" : "");
  if (document.activeElement !== $("oChuoi")) $("oChuoi").value = SEQ.join(" ");

  const tren = $("phanTren"), duoi = $("phanDuoi");
  if (n < cfg.BAT_DAU){
    tren.innerHTML = '<div class="trong">Cần đủ ' + cfg.BAT_DAU + ' ván để bắt đầu. ' +
      'Hiện có ' + n + ' ván, nhập thêm ' + (cfg.BAT_DAU - n) + ' ván nữa.<br>' +
      'Dự báo đầu tiên được ghi cho ván ' + (cfg.BAT_DAU + 1) +
      ', chấm điểm bắt đầu từ ván ' + (cfg.BAT_DAU + 2) + '.</div>' +
      (n ? '<section style="margin-top:16px"><h2>Big road</h2>' + veBigRoad(SEQ) +
           veCauPhaiSinh(SEQ) + "</section>" : "");
    duoi.innerHTML = "";
    return;
  }

  const {duBao, cham} = theoDoi(SEQ, cfg);
  const kq = tinHieu(duBao[n], cham, cfg);
  const q = kq.quyet;

  /* ---------- PHẦN TRÊN: đề xuất → hai tín hiệu → road ---------- */
  let h = '<div class="phan-quyet bg-' + (q === "-" ? "" : q) + '">' +
    '<div class="van">Ván ' + (n+1) + "</div>" +
    '<div class="lon">' + (q === "-" ? "Chờ ván sau" : "Vào cược · " + TEN_DAY_DU[q]) + "</div>" +
    '<div class="vi-sao">' + (q === "-" ? "hai tín hiệu không trùng nhau"
                                        : "hai tín hiệu cùng chỉ một cửa") + "</div></div>";

  h += '<div class="doi">' +
    '<div class="o-tin-hieu"><div class="nhan">Tín hiệu 1 — mạch dài nhất</div>' +
    chip(kq.th1) + '<div class="ly-do">' + esc(kq.chuTh1) + "</div></div>" +
    '<div class="o-tin-hieu"><div class="nhan">Tín hiệu 2 — phiếu bầu</div>' +
    chip(kq.th2) + '<div class="ly-do">' + esc(kq.chuTh2) + "</div></div></div>";

  h += "<section><h2>Big road và cầu phái sinh</h2>" + veBigRoad(SEQ) +
       veCauPhaiSinh(SEQ) + "</section>";
  tren.innerHTML = h;

  /* ---------- PHẦN DƯỚI: tỷ lệ chính xác → bảng 6 engine ---------- */
  let d = "";
  const hq = hieuQuaLuat(SEQ, cfg, duBao);
  d += "<section><h2>Tỷ lệ chính xác của luật, phát lại trên toàn bộ chuỗi</h2>";
  if (!hq || !hq.vao){
    d += '<div class="trong">Luật chưa báo vào cược lần nào, chưa có gì để đánh giá.</div>';
  } else {
    const chenh = (hq.tyLe - hq.bankKhiVao) * 100;
    const z = hq.se > 0 ? (hq.tyLe - hq.bankKhiVao) / hq.se : 0;
    const ev = (1 - cfg.HOA_HONG) * hq.tyLe - (1 - hq.tyLe);
    d += '<div class="so-lieu">' +
      '<div><div class="nhan">Số lần vào cược</div><div class="gia-tri">' + hq.vao +
      '<span class="small muted"> / ' + (hq.vao + hq.cho) + " ván</span></div></div>" +
      '<div><div class="nhan">Tỷ lệ trúng</div><div class="gia-tri">' +
      (hq.tyLe*100).toFixed(1) + '%<span class="small muted"> ±' + (hq.se*100).toFixed(1) +
      "</span></div></div>" +
      '<div><div class="nhan">Banker mù cùng số ván đó</div><div class="gia-tri">' +
      (hq.bankKhiVao*100).toFixed(1) + "%</div></div>" +
      '<div><div class="nhan">Chênh lệch</div><div class="gia-tri">' +
      (chenh >= 0 ? "+" : "") + chenh.toFixed(1) + '<span class="small muted"> đpt · z ' +
      (z >= 0 ? "+" : "") + z.toFixed(2) + "</span></div></div></div>" +
      '<div class="dien-giai">Nếu cược ' + cfg.CUOC.toLocaleString("vi-VN") +
      "đ theo luật này với tỷ lệ trúng trên, giá trị kỳ vọng là " +
      "<b>" + (ev >= 0 ? "+" : "") + (ev*100).toFixed(2) + "%</b> mỗi ván (" +
      Math.round(ev * cfg.CUOC).toLocaleString("vi-VN") + "đ). " +
      (Math.abs(z) < 2 ? "Chênh lệch so với đặt Banker mù vẫn nằm trong vùng nhiễu, cần |z| ≥ 2 mới coi là khác biệt thật."
                       : "z đã vượt 2, nên kiểm chứng lại trên shoe khác trước khi tin.") +
      "</div>";
  }
  d += "</section>";

  d += "<section><h2>Dự báo riêng của 6 engine, chấm từ ván " + (cfg.BAT_DAU + 2) +
       " · ván tie không tính</h2><table><tr>" +
       "<th>Engine</th><th>Ván " + (n+1) + "</th><th>Mạch</th><th>Đúng</th>" +
       '<th style="text-align:right">12 lần gần nhất</th></tr>';
  for (const e of ENGINES){
    const b = kq.bang[e.ten], dx = duBao[n][e.ten];
    const dan = kq.ungVien.includes(e.ten) && kq.th1 !== "-";
    d += '<tr class="' + (dan ? "dan-dau" : "") + '">' +
      '<td><div class="ten-engine">' + (dan ? "▸ " : "") + e.ten + "</div>" +
      '<div class="ghi-chu">' + esc(e.moTa(SEQ, cfg)) + "</div></td>" +
      '<td style="text-align:center">' + chip(dx, true) + "</td>" +
      '<td style="text-align:center"><span class="mach' + (b.mach ? "" : " im") + '">' +
      b.mach + "</span></td>" +
      '<td style="text-align:center" class="small muted">' + b.dung + "/" + b.tong +
      (b.tong ? " · " + Math.round(b.dung/b.tong*100) + "%" : "") + "</td>" +
      '<td style="text-align:right;white-space:nowrap">' + dayCham(cham[e.ten]) + "</td></tr>";
  }
  d += "</table></section>";
  duoi.innerHTML = d;
}

function chayNguongNhieu(){
  const nut = $("nutNhieu");
  nut.disabled = true; nut.textContent = "Đang chạy…";
  setTimeout(() => {
    const cfg = cauHinh();
    const r = nullTestLuat(cfg, 200);
    const hq = hieuQuaLuat(SEQ, cfg);
    let h = "";
    if (!r) h = '<div class="trong">Không đo được.</div>';
    else {
      const z = (hq && hq.se) ? (hq.tyLe - r.tyLe) / hq.se : null;
      h = '<div class="so-lieu" style="margin-top:12px">' +
        '<div><div class="nhan">Shoe mô phỏng</div><div class="gia-tri">' + r.nShoe + "</div></div>" +
        '<div><div class="nhan">Luật vào cược</div><div class="gia-tri">' +
        r.vao.toLocaleString("vi-VN") + " lần</div></div>" +
        '<div><div class="nhan">Luật trúng</div><div class="gia-tri">' + (r.tyLe*100).toFixed(2) +
        '%<span class="small muted"> ±' + (r.se*100).toFixed(2) + "</span></div></div>" +
        '<div><div class="nhan">Banker tự nhiên</div><div class="gia-tri">' +
        (r.bank*100).toFixed(2) + "%</div></div></div>" +
        '<div class="dien-giai">Đây là kết quả khi chạy đúng luật này trên shoe 8 bộ bài chia ' +
        "theo luật Punto Banco, nơi chắc chắn không tồn tại cầu. Con số đó là ngưỡng nhiễu." +
        (z !== null ? " Luật trên chuỗi của bạn so với ngưỡng này: z = " +
          (z >= 0 ? "+" : "") + z.toFixed(2) + "." : "") + "</div>";
    }
    $("ketQuaNhieu").innerHTML = h;
    nut.disabled = false; nut.textContent = "Đo ngưỡng nhiễu";
  }, 30);
}

SEQ = doc();
ve();
